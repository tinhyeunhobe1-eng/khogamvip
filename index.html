<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho Game VIP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .rocket {
            font-size: 60px;
            margin-bottom: 20px;
        }
        h1 {
            color: #ffffff;
            font-size: 32px;
            margin-bottom: 12px;
        }
        .subtitle {
            color: #94a3b8;
            margin-bottom: 40px;
            font-size: 15px;
        }
        input {
            width: 100%;
            max-width: 360px;
            padding: 15px 18px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: white;
            font-size: 15px;
            margin-bottom: 15px;
            outline: none;
        }
        input::placeholder { 
            color: #64748b; 
        }
        button {
            width: 100%;
            max-width: 360px;
            padding: 16px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 5px;
        }
        button:hover {
            opacity: 0.95;
        }
    </style>
</head>
<body>
    <div class="rocket">🚀</div>
    <h1>Kho Game VIP</h1>
    <p class="subtitle">Hệ thống tự động nhận diện UDID của bạn</p>
    
    <input type="text" id="udid" placeholder="Nhập UDID thiết bị của bạn">
    <input type="password" id="password" placeholder="Mật khẩu chứng chỉ P12">
    <button onclick="enterGame()">Vào kho game</button>

    <script>
        function enterGame() {
            const udid = document.getElementById('udid').value.trim();
            const password = document.getElementById('password').value;
            
            if (!udid) {
                alert('Vui lòng nhập UDID!');
                return;
            }
            
            // Lưu UDID vào trình duyệt để sử dụng sau
            localStorage.setItem('user_udid', udid);
            
            // Thay trang web thành link danh sách game của bố
            window.location.href = '#danhsach';
        }
    </script>
</body>
</html>
