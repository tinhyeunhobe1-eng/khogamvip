<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho Game VIP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 50px 35px;
            max-width: 400px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 {
            color: #ffffff;
            font-size: 32px;
            text-align: center;
            margin-bottom: 12px;
        }
        .subtitle {
            color: #94a3b8;
            text-align: center;
            margin-bottom: 40px;
            font-size: 15px;
        }
        input {
            width: 100%;
            padding: 15px 18px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: white;
            font-size: 15px;
            margin-bottom: 18px;
            outline: none;
        }
        input::placeholder {
            color: #64748b;
        }
        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
        .rocket {
            text-align: center;
            font-size: 40px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="rocket">🚀</div>
        <h1>Kho Game VIP</h1>
        <p class="subtitle">Hệ thống tự động nhận diện UDID của bạn</p>
        <input type="text" placeholder="Nhập UDID thiết bị của bạn">
        <input type="password" placeholder="Mật khẩu chứng chỉ P12">
        <button onclick="alert('Đang xử lý...')">Vào kho game</button>
    </div>
</body>
</html>
