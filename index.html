<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách Ứng Dụng</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        body {
            background-color: #f5f5f7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 60px 20px;
        }
        .container {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            padding: 40px 30px;
            width: 100%;
            max-width: 420px;
        }
        .game-icon {
            text-align: center;
            font-size: 60px;
            margin-bottom: 20px;
        }
        h1 {
            text-align: center;
            font-size: 28px;
            color: #1d1d1f;
            margin-bottom: 12px;
        }
        .subtitle {
            text-align: center;
            font-size: 15px;
            color: #86868b;
            margin-bottom: 30px;
        }
        .udid-input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #d2d2d7;
            border-radius: 12px;
            font-size: 15px;
            text-align: center;
            margin-bottom: 12px;
        }
        .check-btn {
            width: 100%;
            padding: 14px;
            background: #007aff;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            margin-bottom: 30px;
        }
        .app-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid #e5e5e7;
        }
        .app-item:last-child {
            border-bottom: none;
        }
        .app-name {
            font-size: 17px;
            color: #1d1d1f;
        }
        .install-btn {
            background: #34c759;
            color: #ffffff;
            border: none;
            border-radius: 20px;
            padding: 8px 22px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
        }
        .hidden {
            display: none !important;
        }
        .empty-text {
            color: #86868b;
            text-align: center;
            padding: 30px 20px;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <div class="container" id="login-box">
        <div class="game-icon">🎮</div>
        <h1>Kiểm tra UDID</h1>
        <p class="subtitle">Nhập UDID của bạn để xem danh sách ứng dụng</p>
        <input type="text" id="udid-input" class="udid-input" placeholder="VD: 00008110-000869CE110A801E">
        <button class="check-btn" onclick="kiemTraUDID()">Xem ứng dụng của tôi</button>
    </div>

    <div class="container hidden" id="app-box">
        <div class="game-icon">🎮</div>
        <h1>Danh sách Ứng Dụng</h1>
        <p class="subtitle">Bấm cài đặt để hệ thống tự động ký và tải về</p>
        
        <div id="app-list"></div>
    </div>

    <script>
        // ==========================================
        const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQmBh4WMKkQdo2edPB1uyEbmtn4K2w5mh5B08qXtHMbSmYoZot8r8dzX-CU4Ezt9_J-3rzbr2xYj2kd/pub?output=tsv";
        // ==========================================

        let dataCache = null;

        async function taiDuLieu() {
            if (dataCache) return dataCache;
            try {
                const res = await fetch(SHEET_URL);
                const text = await res.text();
                const lines = text.split('\n').slice(1);
                dataCache = lines.map(line => {
                    const parts = line.split('\t');
                    return {
                        udid: (parts[0] || '').trim().toUpperCase(),
                        name: (parts[1] || '').trim(),
                        link: (parts[2] || '').trim()
                    };
                }).filter(item => item.udid && item.name);
                return dataCache;
            } catch (e) {
                console.error('Lỗi tải dữ liệu:', e);
                return [];
            }
        }

        async function kiemTraUDID() {
            const udidNhap = document.getElementById('udid-input').value.trim().toUpperCase();
            if (!udidNhap) {
                alert('⚠️ Vui lòng nhập UDID!');
                return;
            }

            const dsGame = await taiDuLieu();
            const gameCuaKhach = dsGame.filter(g => g.udid === udidNhap);

            if (gameCuaKhach.length === 0) {
                alert('❌ UDID chưa được cấp ứng dụng nào\nLiên hệ quản trị viên nhé!');
                return;
            }

            document.getElementById('login-box').classList.add('hidden');
            document.getElementById('app-box').classList.remove('hidden');

            const html = gameCuaKhach.map(g => `
                <div class="app-item">
                    <span class="app-name">${g.name}</span>
                    <a href="${g.link}" target="_blank" class="install-btn">Cài đặt</a>
                </div>
            `).join('');
            
            document.getElementById('app-list').innerHTML = html;
        }
    </script>
</body>
</html>
