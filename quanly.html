<!-- === QUẢN LÝ KHÁCH & IPA === -->
<div class="card">
    <h2>6. Quản Lý Khách & Link Tải</h2>
    <label>UDID của khách:</label>
    <input type="text" id="khach-udid" placeholder="VD: 12345678-1234567890ABCDEF">
    
    <label>Tên ứng dụng:</label>
    <input type="text" id="khach-appname" placeholder="VD: Liên Quân Mobile">
    
    <label>Link tải IPA:</label>
    <input type="text" id="khach-link" placeholder="VD: https://...ipa">
    
    <button class="btn-blue" onclick="themKhach()">Thêm Khách & Link</button>
</div>

<div class="card">
    <h2>7. Danh Sách Khách</h2>
    <div id="khach-list"></div>
</div>

<script>
// === QUẢN LÝ KHÁCH ===
let khachList = JSON.parse(localStorage.getItem('khachList') || '[]');

function luuKhach() {
    localStorage.setItem('khachList', JSON.stringify(khachList));
}

function themKhach() {
    const udid = document.getElementById('khach-udid').value.trim();
    const appname = document.getElementById('khach-appname').value.trim();
    const link = document.getElementById('khach-link').value.trim();
    
    if (!udid || !appname || !link) {
        alert('⚠️ Điền đủ UDID, Tên app và Link nhé!');
        return;
    }
    
    khachList.unshift({
        id: Date.now(),
        udid: udid.toUpperCase(),
        appname,
        link
    });
    
    luuKhach();
    renderKhach();
    
    document.getElementById('khach-udid').value = '';
    document.getElementById('khach-appname').value = '';
    document.getElementById('khach-link').value = '';
    
    alert('✅ Thêm thành công! Khách vào trang chủ gõ UDID là thấy!');
}

function xoaKhach(id) {
    if (confirm('❌ Xóa khách này?')) {
        khachList = khachList.filter(k => k.id !== id);
        luuKhach();
        renderKhach();
    }
}

function renderKhach() {
    const el = document.getElementById('khach-list');
    if (khachList.length === 0) {
        el.innerHTML = '<p class="empty">Chưa có khách nào</p>';
        return;
    }
    el.innerHTML = khachList.map(k => `
        <div class="item-row">
            <div style="max-width:70%">
                <div class="item-name">${k.appname}</div>
                <div class="item-date" style="font-size:11px;word-break:break-all;">${k.udid}</div>
                <div class="item-date" style="font-size:10px;color:#6b7280;word-break:break-all;">${k.link}</div>
            </div>
            <button class="btn-delete" onclick="xoaKhach(${k.id})">Xóa</button>
        </div>
    `).join('');
}

renderKhach();
</script>
