<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Kho Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #1d1d1f;
            margin-bottom: 25px;
            font-size: 22px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #d2d2d7;
            border-radius: 8px;
            font-size: 15px;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #0071e3;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
        }
        button:hover {
            background: #0077ed;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #0071e3;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>➕ Thêm Game cho Khách</h1>
        <form action="https://api.sheetmonkey.io/form/keue3PUCyacAm5FWThpquj" method="POST">
            <label for="udid">UDID của khách:</label>
            <input type="text" id="udid" name="UDID" placeholder="VD: 00008110-000869CE110A801E" required>
            
            <label for="ten">Tên ứng dụng:</label>
            <input type="text" id="ten" name="TenUngDung" placeholder="VD: Liên quân chống tố" required>
            
            <label for="link">Link tải IPA:</label>
            <input type="url" id="link" name="LinkIPA" placeholder="https://..." required>
            
            <button type="submit">📤 Lưu vào Kho Dữ Liệu</button>
        </form>
        <a href="/" class="back-link">← Quay lại trang chủ</a>
    </div>
</body>
</html>
